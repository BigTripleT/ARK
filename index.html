<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap">
<style>
:root{--bg:#e6e6e6;--wave:#f1f1f1;--paper:#fff;--ink:#050505;--mute:#6b6b6b;--line:#333;--dark:#1b1b1b;--chip:#4a4a4a;--panel:#fff;--input:#ececec;--pink:#ff5d8f;--btn:#111;--btnink:#fff;
--f:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232323;--wave:#1a1a1a;--paper:#121212;--ink:#f4f4f4;--mute:#9a9a9a;--line:#bbb;--dark:#0d0d0d;--panel:#242424;--input:#363636;--btn:#f4f4f4;--btnink:#111}}
:root[data-theme="dark"]{--bg:#232323;--wave:#1a1a1a;--paper:#121212;--ink:#f4f4f4;--mute:#9a9a9a;--line:#bbb;--dark:#0d0d0d;--panel:#242424;--input:#363636;--btn:#f4f4f4;--btnink:#111}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;font-family:var(--f);background:var(--paper);color:var(--ink);overflow-x:hidden}
body.open{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.pill{border-radius:999px;font-weight:800;padding:.7em 1.5em;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.pill:hover{transform:scale(1.06)}.pill:active{transform:scale(.96)}
.wrap{max-width:1700px;margin:0 auto;padding:0 clamp(1.2rem,5.5vw,6rem)}
/* hero */
.hero{background:var(--bg);position:relative;padding:clamp(3rem,5vw,4.5rem) 0 0;overflow:hidden}
.hero h1{margin:0;font-weight:800;line-height:.8}
.the{display:block;font-size:clamp(2.6rem,5vw,4.4rem);letter-spacing:-.04em;animation:rise .8s cubic-bezier(.2,.9,.2,1) backwards}
.ark{display:block;font-size:clamp(9rem,24vw,22rem);letter-spacing:-.06em;margin:.02em 0 .12em}
.ark i{display:inline-block;font-style:normal;transition:transform .35s cubic-bezier(.3,1.6,.5,1);animation:rise 1s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i)*.1s + .15s)}
.ark i:hover{transform:translateY(-.06em) rotate(-4deg)}
.tag{font-size:clamp(1.3rem,2.4vw,2rem);margin:0 0 2rem;animation:rise .9s .55s cubic-bezier(.2,.9,.2,1) backwards}
.go{background:var(--btn);color:var(--btnink);font-size:1.8rem;padding:.7em 1.6em;animation:rise .9s .7s cubic-bezier(.2,.9,.2,1) backwards}
.waves{display:block;width:100%;height:clamp(70px,9vw,130px);margin-top:clamp(2.5rem,5vw,5rem);position:relative}
.waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%}
.waves .b{fill:var(--wave);animation:drift 22s linear infinite}
.waves .f{fill:var(--paper);animation:drift 14s linear infinite reverse}
@keyframes drift{to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(55%) rotate(5deg)}}
/* sections */
section.s{padding:clamp(4rem,9vw,8rem) 0 clamp(2rem,4vw,4rem)}
h2.big{margin:0;font-size:clamp(3.2rem,10.5vw,9.5rem);font-weight:800;letter-spacing:-.06em;line-height:.92}
.sub{margin:1rem 0 clamp(2rem,4vw,3.5rem);font-size:1.15rem;color:var(--mute)}
.rv{opacity:0;transform:translateY(40px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
#pairs{display:grid;gap:1rem}
.pair{border:2.5px solid var(--line);border-radius:999px;padding:clamp(1.4rem,3vw,2.4rem) 1.5rem;display:flex;gap:1.6rem;align-items:baseline;justify-content:center;flex-wrap:wrap;font-size:clamp(1.3rem,2.4vw,2rem)}
.who{font-weight:800}.dim{font-weight:400;color:var(--mute)}.amp{font-size:.7em;color:var(--mute)}
.more{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 0 8rem}
.more h2{margin:0 0 2rem;font-size:clamp(3rem,11vw,10rem);font-weight:800;letter-spacing:-.065em;line-height:.9}
.more .wrap{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.more p{max-width:30rem;font-size:1.4rem;line-height:1.5;margin:0 auto}
/* chat overlay */
#chat{position:fixed;inset:0;z-index:20;background:var(--dark);color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
clip-path:circle(0px at var(--x,50%) var(--y,50%));visibility:hidden;transition:clip-path .75s cubic-bezier(.7,0,.2,1),visibility 0s .75s}
body.open #chat{clip-path:circle(160vmax at var(--x,50%) var(--y,50%));visibility:visible;transition-delay:0s}
.bar{display:flex;align-items:center;gap:1.4rem;padding:1rem 1rem .6rem}
.bar h2{margin:0;font-size:clamp(1.8rem,3.4vw,2.8rem);font-weight:800;letter-spacing:-.04em}
#back{background:var(--chip);color:#fff;font-size:1.3rem}
#tabs{display:flex;gap:.7rem;padding:.4rem 1rem 1rem;overflow-x:auto;scrollbar-width:none}
.tab{background:#3a3a3a;color:#fff;font-size:1.35rem;white-space:nowrap;position:relative}
.tab.on{background:#fff;color:#111}
.dot{position:absolute;top:.35rem;right:.5rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--pink)}
.panel{position:relative;flex:1;min-height:0;margin:0 .8rem .8rem;border-radius:32px;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
#log{flex:1;overflow-y:auto;padding:1.4rem 1.6rem;display:flex;flex-direction:column;gap:1.2rem}
.m{max-width:min(75%,560px);align-self:flex-start;display:flex;flex-direction:column;gap:.35rem;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.m.me{align-self:flex-end;align-items:flex-end}
.who2{font-size:.82rem;letter-spacing:.1em;font-weight:800}
.m{position:relative}
.body{border-left:4px solid var(--c,var(--ink));padding:.3rem 0 .3rem .9rem;cursor:pointer}
.m.me .body{border-left:0;border-right:4px solid var(--c,var(--ink));padding:.3rem .9rem .3rem 0;text-align:right}
.tx{margin:0;font-size:1.2rem;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.ph{display:block;max-width:100%;max-height:300px;border-radius:18px;margin:.2rem 0}
.m.me .ph{margin-left:auto}
.hrt{font-size:.95rem;font-weight:800;color:var(--mute);border-radius:999px;padding:.15rem .7rem;opacity:.55;transition:opacity .2s,transform .2s}
.m:hover .hrt{opacity:1}.hrt:hover{transform:scale(1.15)}
.hrt.on{background:#2a2a2a;color:#fff;opacity:1}
.hrt.on::first-letter{color:var(--pink)}
.sys{text-align:center;color:var(--mute);margin:auto;font-size:1.05rem}
.fade{animation:fade 2.8s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}}
.compose{display:flex;gap:.8rem;padding:.9rem;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.compose>*{height:62px;border-radius:999px}
#cam{width:62px;flex:none;background:#2e2e2e;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#cam:hover{transform:rotate(-8deg) scale(1.08)}
#msg{flex:1;min-width:0;border:0;background:var(--input);color:var(--ink);font:inherit;font-size:1.2rem;padding:0 1.6rem;outline:none}
#msg:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 25%,transparent)}
#send{background:#222;color:#fff;font-size:1.3rem;font-weight:800;padding:0 2rem}
.compose :disabled{opacity:.5;cursor:not-allowed}
#gate{position:absolute;inset:0;z-index:2;background:var(--panel);display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:2rem}
#gate.on{display:flex;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
#gate h3{margin:0;font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;letter-spacing:-.055em;line-height:.95}
#gate p{margin:0 0 .6rem;color:var(--mute);font-size:1.15rem}
#nm,#pw{width:min(100%,420px);height:62px;border:0;border-radius:999px;background:var(--input);color:var(--ink);font:inherit;font-size:1.3rem;text-align:center;outline:none}
#join{background:var(--btn);color:var(--btnink);font-size:1.3rem}
.lnk{color:var(--mute);text-decoration:underline;font-size:1rem;padding:.3rem}
#gerr{color:var(--pink);max-width:24rem}
.qt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:100%;border-radius:12px;background:color-mix(in srgb,var(--ink) 8%,transparent);padding:.35rem .75rem;font-size:.85rem;color:var(--mute);gap:.1rem;transition:transform .2s}
.qt:hover{transform:scale(1.03)}
.qt b{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.qt span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:.2rem}
.m.flash .body{animation:flash 1.3s}
@keyframes flash{0%,55%{background:color-mix(in srgb,var(--pink) 30%,transparent)}}
#rbar{display:flex;align-items:center;gap:.8rem;margin:0 .9rem;padding:.55rem 1rem;border-left:3px solid var(--pink);border-radius:12px;background:var(--input);font-size:.95rem;color:var(--mute);animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
#rbar[hidden]{display:none}
#rbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rbar b{color:var(--ink)}
#rx{font-size:1.1rem;padding:.2rem .5rem}
.who2::before{content:"";display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--c,var(--ink));margin-right:.45em;vertical-align:-.03em}
.sw{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.45em;vertical-align:.04em}
.m.cont{margin-top:-1.2rem}
.qt{border-left:3px solid var(--qc,transparent)}
.acts{flex-wrap:wrap;align-items:center}.m.me .acts{justify-content:flex-end}
.chip{font-size:.95rem;font-weight:700;border-radius:999px;padding:.15rem .65rem;background:color-mix(in srgb,var(--ink) 9%,transparent);transition:transform .2s}
.chip:hover{transform:scale(1.12)}
.chip.on{background:color-mix(in srgb,var(--pink) 28%,transparent);outline:1.5px solid var(--pink)}
.pick{display:flex;gap:.3rem;padding:.3rem .55rem;border-radius:999px;background:var(--input);width:max-content;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.pick[hidden]{display:none}
.pick button{font-size:1.5rem;padding:.1rem .3rem;transition:transform .2s}
.pick button:hover{transform:scale(1.35) rotate(-6deg)}
.bin{display:inline-flex;align-items:center}
.bin:hover{color:#ff5d5d;opacity:1}
.rx{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem}
.m.me .rx{justify-content:flex-end}
.menu{display:none;position:absolute;top:100%;margin-top:.2rem;z-index:5;align-items:center;gap:.15rem;padding:.3rem .5rem;border-radius:999px;background:var(--dark);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .25s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
.m.me .menu{right:0}.m:not(.me) .menu{left:0}
.m.sel .menu{display:flex}
.m.sel .body{background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:6px}
.menu .em{font-size:1.45rem;padding:.1rem .3rem;transition:transform .2s}
.menu .em:hover{transform:scale(1.35) rotate(-6deg)}
.menu .act{font-size:.95rem;font-weight:800;padding:.35rem .65rem;border-radius:999px;color:#fff;display:inline-flex;align-items:center;transition:background .2s}
.menu .act:hover{background:rgba(255,255,255,.16)}
.menu .bin:hover{color:#ff6b6b}
.vr{width:1px;align-self:stretch;background:rgba(255,255,255,.25);margin:0 .35rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1><span class="the">The</span><span class="ark" aria-label="Ark"><i style="--i:0">A</i><i style="--i:1">r</i><i style="--i:2">k</i></span></h1>
    <p class="tag">no rush. everyone’s on board.</p>
    <button class="pill go" id="open">chat</button>
  </div>
  <div class="waves" aria-hidden="true">
    <svg viewBox="0 0 2400 120" preserveAspectRatio="none"><path class="b" d="M0 50Q300 0 600 50T1200 50T1800 50T2400 50V120H0Z"/></svg>
    <svg viewBox="0 0 2400 120" preserveAspectRatio="none"><path class="f" d="M0 80Q300 30 600 80T1200 80T1800 80T2400 80V120H0Z"/></svg>
  </div>
</header>

<section class="s"><div class="wrap">
  <h2 class="big rv">who’s on board</h2>
  <p class="sub rv">everyone who hopped on, two by two.</p>
  <div id="pairs"></div>
</div></section>

<section class="more"><div class="wrap">
  <h2 class="rv">room for one more?</h2>
  <p class="rv" style="--d:.1s">share the link with others to start chatting.</p>
</div></section>

<div id="chat" aria-hidden="true">
  <div class="bar"><button class="pill" id="back">← back</button><h2>The Ark</h2></div>
  <nav id="tabs"></nav>
  <div class="panel">
    <div id="gate"><h3>who’s coming aboard?</h3><p>type a name and a password, so it’s really you.</p><input id="nm" placeholder="your name" maxlength="24" autocomplete="username"><input id="pw" type="password" placeholder="password (6+ characters)" maxlength="64" autocomplete="current-password"><button class="pill" id="join">come aboard</button><button class="lnk" id="mode" type="button">been here before? sign in</button><small id="gerr"></small></div>
    <div id="log"></div>
    <div id="rbar" hidden><span id="rtx"></span><button id="rx" aria-label="cancel reply">✕</button></div>
    <div class="compose">
      <button id="cam" aria-label="Send a photo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#cfc6dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg></button>
      <input id="msg" placeholder="Message the ark" autocomplete="off" maxlength="1000">
      <button id="send" class="pill">Send</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,runTransaction,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const FIREBASE_CONFIG={apiKey:"AIzaSyDEHFK9s8Wzij8xX43FJTYEVrQ72nnDemw",authDomain:"the-ark-5d3ad.firebaseapp.com",projectId:"the-ark-5d3ad",storageBucket:"the-ark-5d3ad.firebasestorage.app",messagingSenderId:"1004284310159",appId:"1:1004284310159:web:39fd646386ab92a804b6fa"};
const $=s=>document.querySelector(s),root=document.documentElement;
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));

let db=null,auth=null,myId="",members=[],msgs=[],names={},tab="group",seen=new Set(),unread={},first=true,shown=false,started=false,ready=false,replyTo=null,openMenu=null;
const loadT=Date.now(),pn=id=>names[id]||"someone";
const PAL=["#ff5d8f","#ff9f1c","#f2c744","#2ec4b6","#4ea8ff","#9b7bff","#7bd88f","#e07bff","#17a2b8","#c97b4a"],colors={};
const col=id=>colors[id]||PAL[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const HEART="\u2764\ufe0f",EM=[HEART,"\ud83d\ude02","\ud83d\udc4d","\ud83d\udc4e"];
const BIN='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>';
// reactions live in the message's "hearts" array: "uid" (old heart) or "uid|emoji"
function parse(h){const o={};(h||[]).forEach(t=>{const [u,e]=t.includes("|")?t.split("|"):[t,HEART];(o[e]=o[e]||[]).push(u)});return o}
const vis=m=>tab==="group"?m.to==="group":((m.from===myId&&m.to===tab)||(m.from===tab&&m.to===myId));

function nameEl(m){const e=mk("span","who"),w=mk("i","sw");w.style.background=col(m.id);e.append(w,pn(m.id));return e}
function pairs(){
  const box=$("#pairs");box.textContent="";
  if(!members.length){const p=mk("div","pair");p.append(mk("span","who dim","room for one"));box.append(p);return}
  for(let i=0;i<members.length;i+=2){
    const p=mk("div","pair rv"+(shown?" in":""));p.style.setProperty("--d",(i/2*.08)+"s");
    const b=members[i+1];
    p.append(nameEl(members[i]),mk("span","amp","&"),b?nameEl(b):mk("span","who dim","room for one"));
    box.append(p);if(!shown)io.observe(p);
  }
  shown=true;
}
function tabsR(){
  const n=$("#tabs");n.textContent="";
  const add=(id,label)=>{const b=mk("button","pill tab"+(tab===id?" on":""),label);if(id!=="group"){const w=mk("i","sw");w.style.background=col(id);b.prepend(w)}if(unread[id]&&tab!==id)b.append(mk("i","dot"));b.onclick=()=>{tab=id;clearReply();delete unread[id];tabsR();log(true)};n.append(b)};
  add("group","group");members.filter(m=>m.id!==myId).forEach(m=>add(m.id,pn(m.id)));
}
function clearReply(){replyTo=null;$("#rbar").hidden=true}
function setReply(m){
  replyTo={id:m.id,from:m.from,text:(m.text||"").slice(0,80),img:!!m.img};
  $("#rtx").textContent="";$("#rtx").append(mk("b","","replying to "+(m.from===myId?"yourself":pn(m.from))+" "),document.createTextNode(m.text?m.text.slice(0,80):"photo"));
  $("#rbar").hidden=false;$("#msg").focus({preventScroll:true});
}
function jump(id){
  const e=document.querySelector('[data-id="'+id+'"]');if(!e)return;
  e.scrollIntoView({behavior:"smooth",block:"center"});e.classList.remove("flash");void e.offsetWidth;e.classList.add("flash");
}
function bubble(m,cont){
  const mine=m.from===myId,d=mk("div","m"+(mine?" me":"")),body=mk("div","body");
  d.dataset.id=m.id;d.style.setProperty("--c",col(m.from));
  if(cont)d.classList.add("cont");else d.append(mk("b","who2",mine?"ME":pn(m.from).toUpperCase()));
  if(m.re){const q=mk("button","qt");q.append(mk("b","",m.re.from===myId?"you":pn(m.re.from)),mk("span","",m.re.text||"photo"));q.style.setProperty("--qc",col(m.re.from));q.onclick=()=>jump(m.re.id);d.append(q)}
  if(m.img){const i=new Image();i.src=m.img;i.alt="photo";i.className="ph";body.append(i)}
  if(m.text)body.append(mk("p","tx",m.text));
  d.append(body);
  const rs=parse(m.hearts);
  if(Object.keys(rs).length){const rx=mk("div","rx");Object.keys(rs).forEach(e=>{const c=mk("button","chip"+(rs[e].includes(myId)?" on":""),e+" "+rs[e].length);c.onclick=ev=>{ev.stopPropagation();react(m,e)};rx.append(c)});body.append(rx)}
  const mn=mk("div","menu"),close=()=>{d.classList.remove("sel");openMenu=null};
  EM.forEach(e=>{const x=mk("button","em",e);x.onclick=ev=>{ev.stopPropagation();close();react(m,e)};mn.append(x)});
  mn.append(mk("i","vr"));
  const r=mk("button","act","\u21a9 reply");r.onclick=ev=>{ev.stopPropagation();close();setReply(m)};mn.append(r);
  if(mine){const bn=mk("button","act bin");bn.innerHTML=BIN;bn.setAttribute("aria-label","delete message");bn.onclick=ev=>{ev.stopPropagation();close();del(m)};mn.append(bn)}
  d.append(mn);
  if(openMenu===m.id)d.classList.add("sel");
  body.onclick=()=>{const was=d.classList.contains("sel");document.querySelectorAll(".m.sel").forEach(x=>x.classList.remove("sel"));if(!was){d.classList.add("sel");openMenu=m.id;mn.scrollIntoView({block:"nearest",behavior:"smooth"})}else openMenu=null};
  return d;
}
function log(jump){
  const L=$("#log"),near=L.scrollHeight-L.scrollTop-L.clientHeight<90;L.textContent="";
  const list=msgs.filter(vis);
  if(!list.length)L.append(mk("p","sys",!ready?"chat isn’t set up yet.":!myId?"pick a name to start chatting.":tab==="group"?"say hi to the group.":"just you and "+pn(tab)+"."));
  list.forEach((m,i)=>L.append(bubble(m,i>0&&list[i-1].from===m.from)));
  if(jump||near)L.scrollTop=L.scrollHeight;
}
function note(t){const L=$("#log"),p=mk("p","sys fade",t);L.append(p);L.scrollTop=L.scrollHeight;setTimeout(()=>p.remove(),2800)}

const isMine=x=>x===myId||x.startsWith(myId+"|");
async function react(m,emoji){
  if(!myId)return;
  const tok=myId+"|"+emoji,cur=(m.hearts||[]).find(isMine),same=cur===tok||(emoji===HEART&&cur===myId);
  try{
    await runTransaction(db,async t=>{
      const r=doc(db,"messages",m.id),sn=await t.get(r);if(!sn.exists())return;
      const next=(sn.data().hearts||[]).filter(x=>!isMine(x));if(!same)next.push(tok);
      t.update(r,{hearts:next});
    });
    if(!same)note("You reacted "+emoji+" to "+(m.from===myId?"your":pn(m.from)+"’s")+" chat");
  }catch(e){}
}
async function del(m){
  if(!confirm("Delete this message?"))return;
  try{await deleteDoc(doc(db,"messages",m.id))}
  catch(e){alert("Couldn’t delete: "+(e.code||e.message)+"\n\nIf it says permission-denied, the Firebase rules are missing the delete line or aren’t published yet.")}
}
async function send(img){
  const inp=$("#msg"),text=inp.value.trim();
  if(!myId||(!text&&!img))return;
  inp.value="";
  const re=replyTo;clearReply();
  try{await addDoc(collection(db,"messages"),{from:myId,to:tab,text,img:img||"",ts:Date.now(),hearts:[],...(re?{re}:{})});$("#log").scrollTop=1e9}
  catch(e){note("couldn’t send. you may need contributor access.")}
}
function shrink(f,cb){
  const fr=new FileReader();
  fr.onload=()=>{const i=new Image();i.onload=()=>{
    const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement("canvas");
    c.width=i.width*k|0;c.height=i.height*k|0;c.getContext("2d").drawImage(i,0,0,c.width,c.height);
    let q=.72,u=c.toDataURL("image/jpeg",q);while(u.length>180000&&q>.3){q-=.1;u=c.toDataURL("image/jpeg",q)}cb(u)};i.src=fr.result};
  fr.readAsDataURL(f);
}

$("#open").onclick=async e=>{
  const r=e.currentTarget.getBoundingClientRect();
  root.style.setProperty("--x",(r.left+r.width/2)+"px");root.style.setProperty("--y",(r.top+r.height/2)+"px");
  document.body.classList.add("open");$("#chat").setAttribute("aria-hidden","false");
  setTimeout(()=>{$("#log").scrollTop=1e9;$("#msg").focus({preventScroll:true})},500);
  if(ready&&!myId){$("#gate").classList.add("on");setTimeout(()=>$("#nm").focus({preventScroll:true}),600)}
};
$("#back").onclick=()=>{document.body.classList.remove("open");$("#chat").setAttribute("aria-hidden","true")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#back").click()});
$("#send").onclick=()=>send();
$("#rx").onclick=clearReply;
$("#log").addEventListener("click",e=>{if(!e.target.closest(".m")){document.querySelectorAll(".m.sel").forEach(x=>x.classList.remove("sel"));openMenu=null}});
$("#msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)send()});
$("#cam").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f&&myId)shrink(f,send)};

function lock(on){$("#msg").disabled=$("#send").disabled=$("#cam").disabled=on}
lock(true);$("#msg").placeholder="pick a name first";
ready=!String(FIREBASE_CONFIG.apiKey).startsWith("PASTE");
const store=new Map();
async function start(name){
  if(started)return;started=true;
  myId=auth.currentUser.uid;
  $("#gate").classList.remove("on");lock(false);$("#msg").placeholder="Message the ark";
  try{const r=doc(db,"members",myId),s=await getDoc(r);let color=s.exists()?s.data().color:"";
    if(!color){const all=await getDocs(collection(db,"members")),used=new Set(all.docs.map(x=>x.data().color).filter(Boolean));color=PAL.find(c=>!used.has(c))||PAL[Math.floor(Math.random()*PAL.length)]}
    if(s.exists())await updateDoc(r,{...(name?{name}:{}),color});else await setDoc(r,{t:Date.now(),name:name||"someone",color})}
  catch(e){note("couldn’t join. check the Firebase rules.")}
  onSnapshot(collection(db,"members"),s=>{
    members=s.docs.map(d=>({id:d.id,t:d.data().t||0,name:d.data().name||"",color:d.data().color||""})).sort((a,b)=>a.t-b.t);
    members.forEach(m=>{names[m.id]=m.name;if(m.color)colors[m.id]=m.color});pairs();tabsR();log();
  },()=>{});
  const feed=q=>onSnapshot(q,s=>{
    s.docChanges().forEach(c=>{if(c.type==="removed")store.delete(c.doc.id);else store.set(c.doc.id,{id:c.doc.id,...c.doc.data()})});
    msgs=[...store.values()].sort((a,b)=>a.ts-b.ts);
    msgs.forEach(m=>{
      if(seen.has(m.id))return;seen.add(m.id);
      if(!first&&m.ts>loadT&&m.from!==myId&&(m.to==="group"||m.to===myId)){const k=m.to==="group"?"group":m.from;if(k!==tab||!document.body.classList.contains("open"))unread[k]=1}
    });
    first=false;tabsR();log();
  },()=>{});
  const M=collection(db,"messages");
  feed(query(M,where("to","==","group")));feed(query(M,where("to","==",myId)));feed(query(M,where("from","==",myId)));
  tabsR();log();
}
if(ready){
  const app=initializeApp(FIREBASE_CONFIG);auth=getAuth(app);db=getFirestore(app);
  const saved=()=>{try{return localStorage.getItem("ark-name")||""}catch(e){return""}};
  onAuthStateChanged(auth,u=>{const n=saved();if(u&&n)start(n)});
  let isNew=true;
  $("#mode").onclick=()=>{isNew=!isNew;$("#join").textContent=isNew?"come aboard":"sign in";$("#mode").textContent=isNew?"been here before? sign in":"new here? make a name";$("#pw").autocomplete=isNew?"new-password":"current-password";$("#gerr").textContent=""};
  const join=async()=>{
    const n=$("#nm").value.trim().slice(0,24),pw=$("#pw").value,slug=n.toLowerCase().replace(/[^a-z0-9]/g,""),err=$("#gerr");
    if(!slug){err.textContent="type a name first.";return}
    if(pw.length<6){err.textContent="password needs 6 or more characters.";return}
    const em=slug+"@ark.example.com";
    try{localStorage.setItem("ark-name",n)}catch(e){}
    $("#join").disabled=true;err.textContent="";
    try{
      if(isNew)await createUserWithEmailAndPassword(auth,em,pw);else await signInWithEmailAndPassword(auth,em,pw);
      await start(n);
    }catch(e){
      const c=e.code||"";
      err.textContent=c.includes("email-already")?"that name is taken. try “been here before? sign in”.":c.includes("weak")?"password needs 6 or more characters.":c.includes("operation-not-allowed")?"Email/Password sign-in isn’t turned on in Firebase yet.":"wrong name or password.";
      $("#join").disabled=false;
    }
  };
  $("#join").onclick=join;[$("#nm"),$("#pw")].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")join()}));
}
tabsR();log();pairs();
</script>
